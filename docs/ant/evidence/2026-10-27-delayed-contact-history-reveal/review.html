<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANT visual review</title>
<style>body{font:16px system-ui,sans-serif;margin:24px;color:#202124;background:#fff}main{max-width:1320px;margin:auto}.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}video{display:block;width:100%;aspect-ratio:1;background:#fff}.stills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stills img{width:100%}textarea{width:100%;min-height:110px;margin-top:8px;box-sizing:border-box;font:inherit}@media(max-width:760px){.views{grid-template-columns:1fr}}</style>
<main><div class="views"><section><h2>View 1</h2><video controls muted playsinline preload="metadata" src="./media/view-1.webm"></video><details><summary>Stills</summary><div class="stills"><figure><img src="./stills/view-1-birth.png" alt="View 1 still 1"><figcaption>Still 1</figcaption></figure><figure><img src="./stills/view-1-plus-15s.png" alt="View 1 still 2"><figcaption>Still 2</figcaption></figure><figure><img src="./stills/view-1-plus-30s.png" alt="View 1 still 3"><figcaption>Still 3</figcaption></figure></div></details></section><section><h2>View 2</h2><video controls muted playsinline preload="metadata" src="./media/view-2.webm"></video><details><summary>Stills</summary><div class="stills"><figure><img src="./stills/view-2-birth.png" alt="View 2 still 1"><figcaption>Still 1</figcaption></figure><figure><img src="./stills/view-2-plus-15s.png" alt="View 2 still 2"><figcaption>Still 2</figcaption></figure><figure><img src="./stills/view-2-plus-30s.png" alt="View 2 still 3"><figcaption>Still 3</figcaption></figure></div></details></section></div><p>둘을 동시에 봤을 때 뭐가 다르게 느껴지고, 어떤 점이 자연스럽거나 이상하게 느껴지는지 자유롭게 적어 주세요.</p><textarea aria-label="자유 응답"></textarea></main>
<script>const [a,b]=[...document.querySelectorAll("video")];let lock=false;for(const [v,o] of [[a,b],[b,a]]){v.addEventListener("play",async()=>{if(lock)return;lock=true;o.currentTime=v.currentTime;await o.play().catch(()=>{});lock=false});v.addEventListener("pause",()=>{if(!lock){lock=true;o.pause();lock=false}});v.addEventListener("seeking",()=>{if(!lock){lock=true;o.currentTime=v.currentTime;lock=false}})}for(const [v,o] of [[a,b],[b,a]])v.addEventListener("timeupdate",()=>{if(!lock&&Math.abs(v.currentTime-o.currentTime)>.08){lock=true;o.currentTime=v.currentTime;lock=false}});</script>
</html>
