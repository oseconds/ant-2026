<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>ANT · Open Material Laws</title>
</head>
<body>
  <main>
    <header><p class="eyebrow">ANT / Material Sketchbook v1</p><h1>Open Material Laws</h1><p>연결을 잃는 세계, 서로 다른 속도로 변화하는 세계. 같은 초기 조건의 두 샘플을 함께 관찰합니다.</p></header>
    <section class="controls" aria-label="Material experiment controls">
      <label>세계 <select id="model"><option value="S">Subtractive Formation</option><option value="T">Heterogeneous Local Time</option></select></label>
      <label>Seed <input id="seed" type="number" min="0" max="4294967295" step="1" value="20261005" required /></label>
      <label>활동 <select id="pattern"><option value="wander">두 국소 입력 · 이동</option><option value="stationary">두 국소 입력 · 고정</option><option value="none">입력 없음</option></select></label>
      <button id="run">실행</button><button id="reset">초기화</button>
      <label>관찰 속도 <select id="speed"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option></select></label>
      <label><input id="diagnostic" type="checkbox" /> 내부 상태</label>
      <select id="field" aria-label="Local time diagnostic field" hidden><option value="rate">국소 변화율</option><option value="age">국소 나이 지연</option></select>
    </section>
    <div class="time"><output id="time">0.000 s</output><span id="phase"></span></div>
    <p id="law"></p>
    <canvas id="world" width="1200" height="520" role="img" aria-label="Paired material samples at the displayed global simulation time"></canvas>
    <p id="legend" class="caption"></p>
    <section id="stats" aria-label="Measured current material state"></section>
    <section class="records" aria-label="Reproducible records"><button id="record">현재 기록 저장</button><label>기록 재현 <input id="replay" type="file" accept="application/json,.json" /></label><span id="receipt"></span></section>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>전역 dt 1/60 s · 가상 국소 활동은 0–40 s, 이후에도 물질은 진화합니다 · v1 관찰·재현 한도 1시간 · <a href="./material-sketchbook.html">Sketchbook v0</a></footer>
  </main>
  <script type="module" src="/src/sketchbook-v1/app.js"></script>
</body>
</html>
