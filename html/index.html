<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>STRANGE STRING — Karplus–Strong</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0f3fa;
      --muted: #929bad;
      --dim: #596477;
      --cyan: #91f3ee;
      --blue: #657eff;
      --line: rgba(185, 204, 239, .12);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 40%, rgba(29, 51, 90, .23), transparent 48%),
        radial-gradient(ellipse at 50% 100%, rgba(28, 47, 75, .13), transparent 40%),
        #080b12;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .21;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      padding: 25px clamp(20px, 5vw, 72px) 22px;
    }

    .topbar, .footer {
      display: flex;
      width: min(100%, 1180px);
      align-items: center;
      justify-content: space-between;
    }

    .brand, .edition, .footer-note, .eyebrow, .orb-caption, .readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #d9e3f7;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .2em;
    }

    .brand-mark {
      position: relative;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(145, 243, 238, .75);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(145, 243, 238, .42), inset 0 0 7px rgba(145, 243, 238, .2);
    }

    .brand-mark::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      content: "";
    }

    .edition {
      color: #697589;
      font-size: 9px;
    }

    main {
      display: flex;
      width: 100%;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 0 38px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      color: #a8b4c7;
      font-size: 10px;
      font-weight: 550;
    }

    .eyebrow::before, .eyebrow::after {
      display: block;
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(145, 243, 238, .55));
      content: "";
    }

    .eyebrow::after { transform: rotate(180deg); }

    h1 {
      margin: 0;
      font-size: clamp(29px, 4vw, 45px);
      font-weight: 520;
      letter-spacing: -.065em;
      line-height: 1.28;
      word-break: keep-all;
    }

    .intro {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 360;
      letter-spacing: -.025em;
      line-height: 1.7;
    }

    .instrument-wrap {
      position: relative;
      display: grid;
      width: clamp(280px, 37vw, 430px);
      aspect-ratio: 1;
      place-items: center;
      margin: clamp(28px, 4vh, 45px) 0 24px;
    }

    .instrument-wrap::before,
    .instrument-wrap::after {
      position: absolute;
      inset: 6%;
      border: 1px solid rgba(143, 166, 206, .1);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .instrument-wrap::after {
      inset: 12%;
      border-color: rgba(143, 166, 206, .07);
    }

    .orbit-label {
      position: absolute;
      z-index: 2;
      color: #7e8ba2;
      font: 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .16em;
      pointer-events: none;
    }

    .orbit-label.top { top: 7%; left: 50%; transform: translateX(-50%); }
    .orbit-label.bottom { bottom: 7%; left: 50%; transform: translateX(-50%); }
    .orbit-label.left { top: 50%; left: 2%; transform: translateY(-50%) rotate(-90deg); }
    .orbit-label.right { top: 50%; right: 2%; transform: translateY(-50%) rotate(90deg); }

    .playfield {
      position: relative;
      display: grid;
      width: 76%;
      height: 76%;
      overflow: hidden;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(126, 160, 213, .25);
      border-radius: 50%;
      color: var(--ink);
      cursor: pointer;
      background:
        radial-gradient(circle at 50% 45%, rgba(29, 54, 89, .7), rgba(11, 17, 29, .92) 60%, rgba(8, 11, 18, .96) 100%);
      box-shadow:
        0 0 0 1px rgba(96, 123, 172, .06),
        0 0 55px rgba(68, 111, 180, .12),
        inset 0 0 45px rgba(61, 103, 164, .13);
      -webkit-tap-highlight-color: transparent;
      isolation: isolate;
      transition: border-color .3s ease, box-shadow .3s ease, transform .3s ease;
    }

    .playfield:hover {
      border-color: rgba(145, 243, 238, .58);
      box-shadow: 0 0 0 1px rgba(145, 243, 238, .09), 0 0 75px rgba(81, 153, 185, .2), inset 0 0 55px rgba(61, 124, 165, .18);
      transform: scale(1.012);
    }

    .playfield:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 8px;
    }

    .playfield::before, .playfield::after {
      position: absolute;
      z-index: -1;
      inset: 13%;
      border: 1px solid rgba(139, 171, 218, .12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .playfield::after {
      inset: 23%;
      border-color: rgba(139, 171, 218, .08);
    }

    #attractor {
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .85;
      pointer-events: none;
    }

    .button-core {
      display: flex;
      width: 41%;
      aspect-ratio: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(171, 224, 235, .24);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, rgba(57, 84, 122, .77), rgba(15, 23, 39, .92) 72%);
      box-shadow: 0 0 30px rgba(91, 166, 190, .14), inset 0 1px rgba(255,255,255,.08);
      transition: border-color .35s ease, box-shadow .35s ease, background .35s ease;
    }

    .playfield:hover .button-core, .playfield.is-playing .button-core {
      border-color: rgba(145, 243, 238, .65);
      background: radial-gradient(circle at 50% 35%, rgba(78, 135, 157, .8), rgba(15, 28, 43, .96) 72%);
      box-shadow: 0 0 38px rgba(108, 232, 223, .23), inset 0 1px rgba(255,255,255,.14);
    }

    .core-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 10px;
      color: var(--cyan);
      filter: drop-shadow(0 0 8px rgba(145,243,238,.72));
      transition: transform .35s ease;
    }

    .playfield:hover .core-icon { transform: translateY(-2px); }

    .orb-caption {
      color: #f2f6ff;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .22em;
    }

    .readout {
      margin-top: 7px;
      color: #9ba9bc;
      font-size: 9px;
      letter-spacing: .13em;
    }

    .playfield.is-playing {
      border-color: rgba(145, 243, 238, .82);
      box-shadow: 0 0 0 1px rgba(145,243,238,.12), 0 0 95px rgba(82, 200, 203, .28), inset 0 0 75px rgba(84, 202, 196, .18);
    }

    .playfield.is-playing #attractor { opacity: 1; }

    .playfield.is-playing::before { animation: ring-breathe 1.6s ease-out both; }

    @keyframes ring-breathe {
      0% { transform: scale(.8); opacity: .1; }
      42% { opacity: .9; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .tap-hint {
      margin: 0;
      color: #aab5c7;
      font-size: 12px;
      letter-spacing: -.02em;
    }

    .tap-hint .key {
      display: inline-grid;
      width: 19px;
      height: 19px;
      margin-right: 5px;
      border: 1px solid rgba(170, 190, 220, .2);
      border-radius: 5px;
      color: #cdd6e5;
      font: 10px ui-monospace, monospace;
      place-items: center;
      vertical-align: -4px;
    }

    .footer {
      align-items: flex-end;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .footer-note {
      color: #738096;
      font-size: 9px;
      line-height: 1.8;
    }

    .footer-note strong {
      color: #bac5d8;
      font-weight: 550;
    }

    .algorithm-note {
      max-width: 350px;
      color: #747f92;
      font-size: 10px;
      font-weight: 350;
      letter-spacing: -.015em;
      line-height: 1.8;
      text-align: right;
      word-break: keep-all;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-height: 780px) and (min-width: 620px) {
      .page { padding-top: 18px; padding-bottom: 15px; }
      main { padding-top: 22px; padding-bottom: 24px; }
      .instrument-wrap { width: clamp(260px, 32vh, 340px); margin-top: 24px; }
      h1 { font-size: clamp(28px, 4vh, 36px); }
      .intro { margin-top: 8px; }
    }

    @media (max-width: 620px) {
      .page { padding: 20px 20px 17px; }
      .edition { font-size: 8px; }
      main { padding: 43px 0 48px; }
      h1 { font-size: clamp(30px, 8vw, 39px); }
      .intro { max-width: 290px; font-size: 12px; }
      .instrument-wrap { width: min(82vw, 360px); margin: 32px 0 25px; }
      .footer { align-items: flex-start; gap: 14px; }
      .footer-note { font-size: 8px; }
      .algorithm-note { max-width: 48%; font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> STRANGE STRING</div>
      <div class="edition">SYNTH STUDY&nbsp; / &nbsp;NO. 01</div>
    </header>

    <main>
      <p class="eyebrow">KARPLUS—STRONG STRING MODEL</p>
      <h1>노이즈에서 태어난<br>하나의 현</h1>
      <p class="intro">가운데를 눌러 알고리즘이 만든 스트링 사운드를 들어보세요.</p>

      <div class="instrument-wrap">
        <span class="orbit-label top" aria-hidden="true">FEEDBACK LOOP</span>
        <span class="orbit-label bottom" aria-hidden="true">PLUCK / DECAY</span>
        <span class="orbit-label left" aria-hidden="true">NOISE</span>
        <span class="orbit-label right" aria-hidden="true">RESONANCE</span>
        <button class="playfield" id="pluck" type="button" aria-label="A2 스트링 연주하기" aria-describedby="play-status">
          <canvas id="attractor" aria-hidden="true"></canvas>
          <span class="button-core" aria-hidden="true">
            <svg class="core-icon" viewBox="0 0 24 24" fill="none">
              <path d="M4 12h3l2.1-6 4.8 12 2.1-6H20" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="orb-caption">PLUCK</span>
            <span class="readout">A2&nbsp; · &nbsp;110 Hz</span>
          </span>
        </button>
      </div>

      <p class="tap-hint"><span class="key" aria-hidden="true">↵</span> 눌러서 연주하기</p>
      <p id="play-status" class="sr-only" aria-live="polite">A2 스트링을 연주할 준비가 되었습니다.</p>
    </main>

    <footer class="footer">
      <div class="footer-note"><strong>PLUCKED STRING</strong><br>PHYSICAL MODELING · 110 HZ</div>
      <div class="algorithm-note">짧은 노이즈를 지연선에 넣고 반복해서 평균화하면, 진동이 현의 음색으로 바뀝니다.</div>
    </footer>
  </div>

  <script>
    (() => {
      const button = document.getElementById('pluck');
      const canvas = document.getElementById('attractor');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('play-status');
      const frequency = 110;
      const voices = [];
      let audioContext;
      let playingUntil = 0;

      // Lorenz attractor: a visual echo of the noise settling into a repeatable tone.
      const points = [];
      let x = 0.1, y = 0, z = 0;
      const sigma = 10, rho = 28, beta = 8 / 3, dt = 0.005;
      for (let i = 0; i < 12500; i++) {
        const dx = sigma * (y - x);
        const dy = x * (rho - z) - y;
        const dz = x * y - beta * z;
        x += dx * dt;
        y += dy * dt;
        z += dz * dt;
        if (i > 900) points.push([x, y, z]);
      }

      function drawAttractor(now) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) {
          requestAnimationFrame(drawAttractor);
          return;
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.round(rect.width * dpr);
        const height = Math.round(rect.height * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        ctx.clearRect(0, 0, width, height);
        const pulse = now < playingUntil ? 1 : 0;
        const angle = now * 0.00012;
        const scale = Math.min(width, height) / 66;
        const cos = Math.cos(angle), sin = Math.sin(angle);

        ctx.lineWidth = (1.05 + pulse * .35) * dpr;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = (7 + pulse * 13) * dpr;
        ctx.shadowColor = pulse ? 'rgba(116, 248, 234, .72)' : 'rgba(95, 149, 255, .48)';
        ctx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const px = (p[0] * cos - p[1] * sin) * scale;
          const py = (p[2] - 25) * scale * .8 + (p[0] * sin + p[1] * cos) * scale * .2;
          const sx = width / 2 + px;
          const sy = height / 2 - py;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        const gradient = ctx.createLinearGradient(width * .15, height * .8, width * .85, height * .2);
        gradient.addColorStop(0, `rgba(78, 111, 221, ${.25 + pulse * .2})`);
        gradient.addColorStop(.5, `rgba(118, 205, 222, ${.58 + pulse * .32})`);
        gradient.addColorStop(1, `rgba(122, 137, 255, ${.42 + pulse * .28})`);
        ctx.strokeStyle = gradient;
        ctx.stroke();
        ctx.shadowBlur = 0;
        requestAnimationFrame(drawAttractor);
      }
      requestAnimationFrame(drawAttractor);

      function createStringBuffer(audio) {
        const sampleRate = audio.sampleRate;
        const duration = 4.6;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = audio.createBuffer(1, frameCount, sampleRate);
        const output = buffer.getChannelData(0);
        const delaySize = Math.max(2, Math.round(sampleRate / frequency));
        const delayLine = new Float32Array(delaySize);
        for (let i = 0; i < delaySize; i++) delayLine[i] = Math.random() * 2 - 1;

        let cursor = 0;
        const loss = 0.99996;
        for (let i = 0; i < frameCount; i++) {
          const next = (cursor + 1) % delaySize;
          const sample = delayLine[cursor];
          delayLine[cursor] = (delayLine[cursor] + delayLine[next]) * 0.5 * loss;
          cursor = next;

          const attack = Math.min(1, i / 90);
          const tail = Math.min(1, (frameCount - i) / (sampleRate * 0.12));
          output[i] = sample * attack * tail;
        }
        return buffer;
      }

      async function pluck() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error('Web Audio API is unavailable');
          if (!audioContext) audioContext = new AudioContextClass();
          if (audioContext.state === 'suspended') await audioContext.resume();

          const now = audioContext.currentTime;
          if (voices.length >= 3) {
            const oldest = voices.shift();
            oldest.gain.gain.cancelScheduledValues(now);
            oldest.gain.gain.setValueAtTime(Math.max(.001, oldest.gain.gain.value), now);
            oldest.gain.gain.exponentialRampToValueAtTime(.001, now + .07);
            oldest.source.stop(now + .075);
          }

          const source = audioContext.createBufferSource();
          const gain = audioContext.createGain();
          source.buffer = createStringBuffer(audioContext);
          gain.gain.value = .52;
          source.connect(gain);
          gain.connect(audioContext.destination);
          source.onended = () => {
            const index = voices.findIndex(voice => voice.source === source);
            if (index !== -1) voices.splice(index, 1);
          };
          voices.push({ source, gain });
          source.start();

          playingUntil = performance.now() + 1000;
          button.classList.remove('is-playing');
          void button.offsetWidth;
          button.classList.add('is-playing');
          window.setTimeout(() => button.classList.remove('is-playing'), 1050);
          status.textContent = 'A2 스트링을 연주하고 있습니다.';
          window.setTimeout(() => {
            if (!voices.length) status.textContent = '다시 눌러 스트링을 연주할 수 있습니다.';
          }, 1800);
        } catch (error) {
          console.error(error);
          status.textContent = '이 브라우저에서 오디오를 시작할 수 없습니다.';
        }
      }

      button.addEventListener('click', pluck);
    })();
  </script>
</body>
</html>
